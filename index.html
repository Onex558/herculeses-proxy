*{box-sizing:border-box}
:root{
  --bg:#202124;--surface:#292a2d;--surface2:#35363a;--border:rgba(255,255,255,.08);

  --tab-h:36px;--bar-h:44px;
}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Roboto,sans-serif}

.l5m6n{width:16px;min-width:16px;text-align:center;color:var(--muted);font-size:11px}
.f1g2h.i3j4k .l5m6n{color:var(--gold)}

.r9s0t{width:20px;height:20px;padding:0;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--muted);cursor:pointer;font-size:10px;opacity:0}
.f1g2h:hover .r9s0t,.f1g2h.i3j4k .r9s0t{opacity:1}
.r9s0t:hover{background:rgba(255,255,255,.12);color:var(--text)}
#u1v2w{width:28px;height:28px;margin:0 0 4px 6px;padding:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:transparent;color:var(--muted);cursor:pointer;font-size:13px}

form#x3y4z{width:100%;height:var(--bar-h);padding:0 10px;display:flex;align-items:center;gap:6px;background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:15}
